[workspace]

[package]
name = "magnetar-loader-gguf"
version = "1.0.0-RC0"
edition = "2024"
license = "MIT"
description = "GGUF production model loader for the Magnetar inference runtime."
repository = "https://github.com/astorise/Magnetar-loader-GGUF"
readme = "README.md"
keywords = ["ai", "inference", "magnetar"]
categories = ["science"]
rust-version = "1.98"

[dependencies]
# `path` resolves inside a checkout of the parent Magnetar repository;
# `version` is what `cargo publish` records for crates.io consumers.
magnetar-runtime = { version = "1.0.0-RC0", path = "../../magnetar-runtime" }
magnetar-format-gguf = { version = "1.0.0-RC0", path = "../../formats/gguf" }
# Real GGUF-embedded-vocabulary tokenizer construction (byte-level BPE,
# matching Qwen2's real tokenizer shape): built programmatically from the
# GGUF file's own `tokenizer.ggml.tokens`/`merges` arrays via `tokenizers`'
# `BPE::builder().vocab_and_merges(...)`, never a `tokenizer.json` file
# (GGUF embeds the vocabulary directly, unlike a Hugging Face bundle).
# Kept out of `magnetar-runtime` entirely, matching `loaders/huggingface`'s
# own use of this crate.
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

[dev-dependencies]
tempfile = "3"
